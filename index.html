<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DealHunter</title>

<style>
body {
  background:#101410;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
  max-width:600px;
  margin:auto;
}

h1 {
  color:#53e68b;
  font-size:32px;
}

.card {
  background:#1c241e;
  padding:18px;
  border-radius:14px;
  margin:15px 0;
}

input {
  display:block;
  width:100%;
  padding:13px;
  margin:10px 0;
  box-sizing:border-box;
  background:#101810;
  border:1px solid #405044;
  color:white;
  border-radius:8px;
}

button {
  background:#35c875;
  padding:14px;
  border:0;
  border-radius:9px;
  width:100%;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
}

.green { color:#53e68b; }
.orange { color:#ffc266; }
.red { color:#ff7777; }

.secondary {
  background:#405044;
  color:white;
}

.danger {
  background:#a83232;
  color:white;
}

#dh-chat-button {
  width:auto;
  margin:0;
}

#dh-chat-window button {
  width:auto;
  margin:0;
}

#dh-chat-window input {
  width:auto;
  margin:0;
  box-sizing:border-box;
}
</style>
</head>

<body>

<h1>⚡ DealHunter</h1>
<p>Ton assistant achat-revente</p>

<div class="card">
  <h3>💰 Mon budget</h3>
  <h2 class="green" id="budget">22,00 €</h2>
  <p>Budget initial : 22 €</p>
  <p>Argent utilisé : <span id="spent">0 €</span></p>
  <p>Bénéfices potentiels : <span id="profit">0 €</span></p>
</div>

<div class="card">
  <h3>🔎 Ajouter une affaire</h3>

  <input id="name" placeholder="Nom de l'article">
  <input id="buy" type="number" min="0" step="0.01" placeholder="Prix d'achat (€)">
  <input id="fees" type="number" min="0" step="0.01" placeholder="Frais (€)" value="0">
  <input id="sell" type="number" min="0" step="0.01" placeholder="Prix de revente (€)">
  <input id="url" placeholder="Lien Vinted">

  <button onclick="addDeal()">⭐ Enregistrer pour plus tard</button>
  <p class="orange">Cette affaire sera sauvegardée sans toucher à ton budget.</p>
</div>

<h2>⭐ À surveiller</h2>
<div id="watchlist"></div>

<h2>🔥 Mes achats</h2>
<div id="deals"></div>

<script>
let budget = Number(localStorage.getItem("budget") || 0);

let deals = JSON.parse(localStorage.getItem("deals") || "[]");
let watchlist = JSON.parse(localStorage.getItem("watchlist") || "[]");

// Anciennes affaires conservées comme achats
// Elles restent donc comptabilisées dans le budget.

function saveData() {
  localStorage.setItem("deals", JSON.stringify(deals));
  localStorage.setItem("watchlist", JSON.stringify(watchlist));
  localStorage.setItem("budget", budget);
}

function calculateSpent() {
  return deals.reduce(
    (s, d) => s + Number(d.buy) + Number(d.fees), 0
  );
}

function calculateProfit(d) {
  return Number(d.sell) - Number(d.buy) - Number(d.fees);
}

function isValidDeal(deal) {
  return deal.name &&
    Number.isFinite(Number(deal.buy)) &&
    Number.isFinite(Number(deal.sell)) &&
    Number.isFinite(Number(deal.fees)) &&
    Number(deal.buy) >= 0 &&
    Number(deal.sell) >= 0 &&
    Number(deal.fees) >= 0;
}

// Connexion avec le bot
window.DealHunterData = {
  getBudget: () => budget,

  // Le bot consulte les achats réels
  getDeals: () => deals,

  // Le bot peut aussi consulter les affaires à surveiller
  getWatchlist: () => watchlist,

  // Une analyse enregistrée par le bot va dans À surveiller
  addDeal: (deal) => {
    if (!isValidDeal(deal)) return false;

    watchlist.push({
      ...deal,
      buy: Number(deal.buy),
      sell: Number(deal.sell),
      fees: Number(deal.fees)
    });

    saveData();
    render();
    return true;
  }
};

// Ajout manuel : toujours dans À surveiller
function addDeal() {
  const name = document.getElementById("name").value.trim();
  const buyValue = document.getElementById("buy").value;
  const feesValue = document.getElementById("fees").value;
  const sellValue = document.getElementById("sell").value;
  const url = document.getElementById("url").value.trim();

  if (!name || buyValue === "" || sellValue === "" || feesValue === "") {
    alert("Remplis correctement les informations !");
    return;
  }

  const deal = {
    name,
    buy: Number(buyValue),
    fees: Number(feesValue),
    sell: Number(sellValue),
    url
  };

  if (!isValidDeal(deal)) {
    alert("Les prix doivent être des nombres positifs !");
    return;
  }

  watchlist.push(deal);
  saveData();
  render();

  document.getElementById("name").value = "";
  document.getElementById("buy").value = "";
  document.getElementById("fees").value = "0";
  document.getElementById("sell").value = "";
  document.getElementById("url").value = "";

  alert("⭐ Affaire enregistrée dans À surveiller !");
}

// Déplacer une affaire vers les achats
function buyDeal(index) {
  const deal = watchlist[index];
  const spent = calculateSpent();
  const cost = Number(deal.buy) + Number(deal.fees);

  if (spent + cost > budget) {
    alert(
      "❌ Budget insuffisant !\n\n" +
      "Budget disponible : " + (budget - spent).toFixed(2) + " €\n" +
      "Coût de cette affaire : " + cost.toFixed(2) + " €"
    );
    return;
  }

  deals.push(deal);
  watchlist.splice(index, 1);

  saveData();
  render();

  alert("✅ Affaire déplacée dans Mes achats !");
}
// Modifier une affaire
function editDeal(index, type) {
  const list = type === "watchlist" ? watchlist : deals;
  const deal = list[index];

  const name = prompt("Nom de l'article :", deal.name);
  if (name === null) return;

  const buy = prompt("Prix d'achat (€) :", deal.buy);
  if (buy === null) return;

  const fees = prompt("Frais (€) :", deal.fees);
  if (fees === null) return;

  const sell = prompt("Prix de revente (€) :", deal.sell);
  if (sell === null) return;

  const url = prompt("Lien de l'annonce :", deal.url || "");
  if (url === null) return;

  const updatedDeal = {
    name: name.trim(),
    buy: Number(buy),
    fees: Number(fees),
    sell: Number(sell),
    url: url.trim()
  };

  if (!isValidDeal(updatedDeal)) {
    alert("Informations invalides !");
    return;
  }

  // Vérifier le budget si c'est un achat
  if (type === "purchase") {
    const spentWithoutThisDeal =
      calculateSpent() - Number(deal.buy) - Number(deal.fees);

    const newCost = updatedDeal.buy + updatedDeal.fees;

    if (spentWithoutThisDeal + newCost > budget) {
      alert("❌ Modification refusée : ton budget serait dépassé !");
      return;
    }
  }

  list[index] = updatedDeal;

  saveData();
  render();

  alert("✅ Annonce modifiée !");
}
function deleteWatchlist(index) {
  if (!confirm("Supprimer cette affaire ?")) return;

  watchlist.splice(index, 1);
  saveData();
  render();
}

function deleteDeal(index) {
  if (!confirm("Supprimer cet achat ?")) return;

  deals.splice(index, 1);
  saveData();
  render();
}

// Création sécurisée du lien Vinted
function addVintedLink(div, url) {
  if (!url) return;

  try {
    const parsed = new URL(url);

    if (
      parsed.protocol === "https:" &&
      (parsed.hostname === "vinted.fr" ||
       parsed.hostname.endsWith(".vinted.fr") ||
       parsed.hostname === "vinted.com" ||
       parsed.hostname.endsWith(".vinted.com"))
    ) {
      const link = document.createElement("a");
      link.href = parsed.href;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Voir l'annonce";
      link.style.color = "#53e68b";
      div.appendChild(link);
    }
  } catch (error) {}
}

// Affichage d'une carte
function createDealCard(d, index, type) {
  console.log("PHOTO REÇUE :", d.image);
  const div = document.createElement("div");
  div.className = "card";

  const title = document.createElement("h3");
  if (d.image && /^https:\/\//i.test(d.image)) {
  const image = document.createElement("img");
  image.src = d.image;
  image.alt = d.name || "Photo de l'article";
  image.style.cssText = "width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin-bottom:10px;background:#101810;";
  image.onerror = () => {
    image.style.display = "none";
  };
  div.appendChild(image);
}
  title.textContent = d.name;

  const details = document.createElement("p");
  details.textContent =
    "Achat : " + Number(d.buy).toFixed(2) +
    " € | Revente : " + Number(d.sell).toFixed(2) + " €";

  const fees = document.createElement("p");
  fees.textContent = "Frais : " + Number(d.fees).toFixed(2) + " €";

  const result = document.createElement("p");
  const profit = calculateProfit(d);

  result.textContent =
    "Bénéfice estimé : " + profit.toFixed(2) + " €";

  result.className = profit >= 0 ? "green" : "red";

div.append(title, details, fees, result);
addVintedLink(div, d.url);

const editButton = document.createElement("button");
editButton.className = "secondary";
editButton.textContent = "✏️ Modifier";
editButton.onclick = () => editDeal(index, type);

div.appendChild(editButton);

  if (type === "watchlist") {
    const buyButton = document.createElement("button");
    buyButton.textContent = "🛒 Acheter cette affaire";
    buyButton.onclick = () => buyDeal(index);

    div.appendChild(buyButton);

    const del = document.createElement("button");
    del.className = "danger";
    del.textContent = "Supprimer";
    del.onclick = () => deleteWatchlist(index);

    div.appendChild(del);
  } else {
    const status = document.createElement("p");
    status.className = "green";
    status.textContent = "✅ Achat comptabilisé dans ton budget";

    const del = document.createElement("button");
    del.className = "danger";
    del.textContent = "Supprimer";
    del.onclick = () => deleteDeal(index);

    div.append(status, del);
  }
console.log("Bouton modifier ajouté :", editButton);
  return div;
}

// Actualisation de l'interface
function render() {
  const spent = calculateSpent();

  const allDeals = [...deals, ...watchlist];

  const profit = allDeals.reduce(
    (s, d) => s + calculateProfit(d), 0
  );

  document.getElementById("budget").textContent =
    (budget - spent).toFixed(2) + " €";

  document.getElementById("spent").textContent =
    spent.toFixed(2) + " €";

  const profitElement = document.getElementById("profit");
  profitElement.textContent = profit.toFixed(2) + " €";
  profitElement.className = profit >= 0 ? "green" : "red";

  const watchListElement = document.getElementById("watchlist");
  watchListElement.innerHTML = "";

  if (watchlist.length === 0) {
    watchListElement.textContent = "Aucune affaire à surveiller pour le moment.";
  } else {
    watchlist.forEach((d, i) => {
      watchListElement.appendChild(
        createDealCard(d, i, "watchlist")
      );
    });
  }

  const dealsElement = document.getElementById("deals");
  dealsElement.innerHTML = "";

  if (deals.length === 0) {
    dealsElement.textContent = "Tu n'as pas encore d'achats enregistrés.";
  } else {
    deals.forEach((d, i) => {
      dealsElement.appendChild(
        createDealCard(d, i, "purchase")
      );
    });
  }
}

render();
</script>

<script src="bot.js"></script>

</body>
</html>
